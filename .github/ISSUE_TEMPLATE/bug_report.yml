name: "Bug report"
title: "[bug] "
description: Describe a bug in detail
labels: ["type: bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit
        1. Search [NoteLoom issues](https://github.com/ksjpswaroop/NoteLoom/issues) to see if this is already reported.
        2. Try the latest NoteLoom release and confirm the bug still happens.
        3. Make sure this is an app bug, not an AI provider, proxy, or network issue.
        4. Include clear steps, expected vs actual behavior, and as much detail as you can.
        5. Keep discussion constructive.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the bug, including reproduction steps, expected behavior, and actual behavior. Screenshots or a short video help.
      placeholder: Bug description
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NoteLoom version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Error logs
      description: Open developer tools (right-click) and paste any relevant errors here.
      placeholder: Bug logs
